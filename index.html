<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora de equipos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1d2a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#e9ece7;--card:#f8f9f6;--ink:#1d2a26;--mute:#5d6b65;--line:#cfd6cf;--acc:#1d2a26;--accink:#f8f9f6;--tag:#f3d57a;--tagink:#3a2c00;--ok:#2f7a4f;--danger:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141a18;--card:#1d2522;--ink:#e6ebe7;--mute:#97a49d;--line:#2f3b36;--acc:#e6ebe7;--accink:#141a18;--tag:#d8a31a;--tagink:#201700;--ok:#6cc08d;--danger:#f28b82}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:1.35rem;margin:0;word-break:break-word}
h2{font-size:1.05rem;margin:0 0 8px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px}
header.head-equipo .head-acciones{display:flex;align-items:center;gap:8px;margin-left:auto}
header.head-equipo h1{width:100%;order:3;margin-top:2px}
.sub-equipo{width:100%;order:4;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;touch-action:manipulation}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.btn-sm{padding:7px 12px;font-size:.9rem}
button.btn-xs{padding:6px 10px;font-size:.82rem;border-radius:6px}
button.btn-peligro{background:transparent;color:var(--danger);border:1px solid var(--danger)}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.row{display:flex;gap:8px}
.col-btns{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.equipo{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400}
.equipo b{display:block;font-size:1.05rem;word-break:break-word}
.equipo small{color:var(--mute);display:block;word-break:break-word}
.estado{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:0 10px;margin-bottom:4px}
.estado.listo{color:var(--ok);border-color:var(--ok)}
.falta{background:var(--tag);color:var(--tagink);border:0;border-radius:8px;padding:14px}
.falta h2{margin-bottom:6px}
.falta textarea{background:transparent;border:1px dashed currentColor;min-height:64px}
.falta textarea::placeholder{color:inherit;opacity:.6}
.falta .msg{color:inherit;opacity:.85}
.dia-titulo{font-weight:700;font-size:.95rem;margin:14px 0 6px;padding-left:2px}
.dia-titulo:first-child{margin-top:4px}
.dia-caja{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.dia-caja:last-child{margin-bottom:0}
.hist-pend{background:rgba(216,163,26,.14);border:1px solid var(--tag);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.hist-pend-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.hist-pend-tag{font-size:.76rem;font-weight:700;background:var(--tag);color:var(--tagink);border-radius:99px;padding:1px 9px}
.pend-item{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:7px 4px;border-top:1px dashed rgba(216,163,26,.45);border-radius:6px}
.pend-item:first-child{border-top:0}
.pend-item.marcado{background:rgba(216,163,26,.2)}
.pend-body{min-width:0;flex:1}
.pend-texto{margin:0;white-space:pre-wrap;font-size:.95rem;word-break:break-word}
.pend-texto.subrayado{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--tag);font-weight:600}
.pend-meta{font-size:.78rem;color:var(--mute);margin-top:2px}
.pend-acciones{display:flex;align-items:center;gap:6px;flex-shrink:0}
.alerta-dup{margin-top:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--tag);background:rgba(216,163,26,.14);font-size:.9rem}
.alerta-dup p{margin:0}
.nota{padding:10px 0;border-top:1px solid var(--line)}
.dia-caja > .nota:first-child{border-top:0;padding-top:2px}
.dia-caja > .nota:last-child{padding-bottom:2px}
.nota-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.nota-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.nota time{font-weight:600;font-size:.88rem;color:var(--mute)}
.nota .hora{color:var(--mute);font-weight:400}
.nota .autor,.autor{color:var(--mute);font-size:.85rem}
.nota p{margin:0;white-space:pre-wrap;word-break:break-word}
.nota-edit textarea{min-height:76px;margin-bottom:8px}
.vacio{color:var(--mute);text-align:center;padding:24px 0}
.msg{color:var(--mute);font-size:.85rem;min-height:1.2em;margin-top:6px}
.err{color:var(--danger)}
[hidden]{display:none!important}
label{display:block;font-weight:600;margin:12px 0 4px}
.fotos,.galeria{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto{position:relative}
.foto img,.galeria img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.foto .x{position:absolute;top:2px;right:2px;padding:0 9px;line-height:28px;background:var(--card)}
.visor{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;cursor:zoom-out}
.visor img{max-width:100%;max-height:100%;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}
.modal .card{width:100%;max-width:560px;margin:0;max-height:92vh;overflow-y:auto}
.resumen-bloque{padding:10px 0;border-top:1px solid var(--line)}
.resumen-bloque:first-of-type{border-top:0;padding-top:4px}
.resumen-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.resumen-titulo{font-weight:700;font-size:.95rem}
.resumen-tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.word-count{font-size:.8rem;color:var(--mute)}
.word-count.exceso{color:var(--danger);font-weight:600}
.area-cliente{min-height:76px}
.area-tecnico{min-height:124px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
@media(max-width:480px){
  .grid2{grid-template-columns:minmax(0,1fr)}
}
.lista-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:0 2px;min-height:34px}
.lista-head h2{margin:0}
.lista-tools{display:flex;align-items:center;gap:8px}
.count{font-size:.85rem;color:var(--mute)}
.buscador{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.buscador input{flex:1 1 180px}
.buscador select{flex:1 1 140px}
.equipo-card{display:flex;align-items:center;justify-content:space-between;gap:12px}
.equipo-info{min-width:0;flex:1}
.equipo-thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex-shrink:0}
.ficha{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ficha img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;flex-shrink:0}
.ficha p{margin:2px 0;font-size:.9rem;word-break:break-word}
input[type=file]{padding:8px}
main.ancho{max-width:1100px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.movil-toggle{width:100%;margin-bottom:12px}
@media(max-width:899px){
  .solo-pc{display:none}
  .form-oculto-movil{display:none}
  .panel-reporte.oculto-movil{display:none}
}
@media(min-width:900px){
  main{padding:16px}
  h1{font-size:1.5rem}
  .movil-toggle,.btn-reporte-movil{display:none}
  .cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
  .sticky{position:sticky;top:16px}
  .hist{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
}
</style>
</head>
<body>
<main id="app"></main>
<script type="module" src="app.js"></script>
</body>
</html>
